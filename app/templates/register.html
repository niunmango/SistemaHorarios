{% extends "base.html" %}

{% block title %}Registrar Usuario{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center py-10">
    <div class="w-full max-w-lg bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl p-8">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-400">
                <i class="fa-solid fa-user-plus text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Crear Nueva Cuenta</h2>
            <p class="text-slate-400 text-sm mt-1">Gestión de cuentas y roles del CURZA</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <div>
                <label for="nombre_completo" class="block text-sm font-medium text-slate-300 mb-1">Nombre Completo</label>
                <input type="text" id="nombre_completo" name="nombre_completo" required
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="Ej: Lic. Juan Pérez">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                           placeholder="jperez">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                           placeholder="jperez@fi.uncoma.edu.ar">
                </div>
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-slate-300 mb-1">Rol / Permiso</label>
                <select id="role" name="role" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="alumno">Alumno (Solo consulta)</option>
                    <option value="docente">Docente (Consulta y solicitudes)</option>
                    <option value="gestor_aulas">Gestor de Aulas (Gestión de horarios y salas)</option>
                    <option value="admin">Administrador General</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                           placeholder="••••••••">
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-slate-300 mb-1">Confirmar Contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                           class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all">
                Registrar Usuario
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-700/60 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-xs text-slate-400 hover:text-white">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver a Iniciar Sesión
            </a>
        </div>

    </div>
</div>
{% endblock %}
