name: CI/CD Pipeline - Sistema Horarios CURZAS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Permisos explícitos para publicar en GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Pruebas Automatizadas & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Linting de Código
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar Test de Reglas (>50% sincrónico y solapamientos)
        run: |
          python tests/test_rules_unittest.py

  build-container:
    name: Construcción de Contenedor & Push a Registry
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v5

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Publicar Imagen de Contenedor en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
